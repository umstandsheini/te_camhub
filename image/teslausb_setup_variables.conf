# TeslaCam Hub – Einstellungen für die Erstinstallation
#
# Zwei Wege:
#   A) Diese Datei jetzt ausfüllen (mindestens SSID und WIFIPASS), speichern,
#      Datenträger in den Pi – fertig.
#   B) Datei unverändert lassen: Der Pi öffnet nach dem Start das WLAN
#      "TeslaCam-Setup" (Passwort: teslacam-setup), dort ein Formular ausfüllen.
#
# Werte stehen in einfachen Anführungszeichen. Ein ' im Wert schreibt man als '\''
# Nach der Installation lässt sich fast alles in der Hub-Oberfläche ändern.

## WLAN zu Hause (Pflicht) – die Installation lädt Pakete aus dem Internet
export SSID='DEIN_WLAN'
export WIFIPASS='DEIN_WLAN_PASSWORT'
export WIFI_COUNTRY='DE'

## Gerätename (im Browser dann https://teslausb.local) und Zeitzone
export TESLAUSB_HOSTNAME='teslausb'
export TIME_ZONE='Europe/Berlin'

## NAS für die Archivierung (SMB/CIFS). Mit NAS: ARCHIVE_SYSTEM='cifs' und die
## vier Zeilen darunter ausfüllen, z. B. ARCHIVE_SERVER='nas' und
## SHARE_NAME='Video/TeslaCam'. Geht auch später in der Hub-Oberfläche.
export ARCHIVE_SYSTEM='none'
export ARCHIVE_SERVER=''
export SHARE_NAME=''
export SHARE_USER=''
export SHARE_PASSWORD=''
export ARCHIVE_RECENTCLIPS='true'
export ARCHIVE_SAVEDCLIPS='true'
export ARCHIVE_SENTRYCLIPS='true'

## Laufwerke fürs Auto. CAM_SIZE etwa ein Drittel bis die Hälfte des Datenträgers,
## der Rest bleibt für Snapshots. 0 = Laufwerk weglassen.
export CAM_SIZE='40G'
export MUSIC_SIZE='4G'
export LIGHTSHOW_SIZE='1G'
export BOOMBOX_SIZE='100M'
# Systempartition des Images um diesen Wert vergrößern (Platz für Pakete)
export INCREASE_ROOT_SIZE='4G'

## Freigabe der Aufnahmen im Heimnetz (SMB, nur lesen)
export SAMBA_ENABLED='true'

## Optional: Anmeldung per SSH als Benutzer pi
# export SSH_PUBKEY='ssh-ed25519 AAAA... name@rechner'
# export PI_PASSWORD='...'   (wird nach dem ersten Start aus dieser Datei entfernt)
