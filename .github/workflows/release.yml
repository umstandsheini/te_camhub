# A tag vYYYY.MM.DD (or vYYYY.MM.DD.N) builds a release:
#   te_camhub-<tag>.tar.gz   source tree with VERSION = <tag> -- what the Hub's
#                            update function (hub/app/hubupdate.py) installs
#   te_camhub-<tag>.img.xz   installation image (tools/build-image.sh)
#   *.sha256                 checksums; the Hub refuses a package without one
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache the Raspberry Pi OS base image
        uses: actions/cache@v4
        with:
          path: .image-cache
          key: raspios-base-${{ hashFiles('tools/build-image.sh') }}

      - name: Check tag
        run: |
          echo "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+(\.[0-9]+)*$' \
            || { echo "tag must look like v2026.09.17 or v2026.09.17.1"; exit 1; }

      - name: Source package
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist stage/te_camhub
          git archive HEAD | tar -x -C stage/te_camhub
          echo "$TAG" > stage/te_camhub/VERSION
          tar -C stage -czf "dist/te_camhub-$TAG.tar.gz" te_camhub

      - name: Installation image
        run: sudo tools/build-image.sh --src "dist/te_camhub-${GITHUB_REF_NAME}.tar.gz" --out "dist/te_camhub-${GITHUB_REF_NAME}.img.xz"

      - name: Checksums
        run: |
          cd dist
          for f in *.tar.gz *.img.xz; do sha256sum "$f" > "$f.sha256"; done

      # The release is created empty first and every file uploaded on its own,
      # with retries: uploading the ~460 MB image got an HTTP 500 from GitHub
      # on the first try (2026-09-17), and `gh release create` with files
      # deletes the whole release when one upload fails.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "${GITHUB_REF_NAME}" --title "TeslaCam Hub ${GITHUB_REF_NAME}" --generate-notes --verify-tag
          for f in dist/*
          do
            for try in 1 2 3
            do
              if gh release upload "${GITHUB_REF_NAME}" "$f" --clobber
              then
                continue 2
              fi
              echo "upload of $f failed (try $try), retrying"
              sleep 30
            done
            echo "giving up on $f"
            exit 1
          done
